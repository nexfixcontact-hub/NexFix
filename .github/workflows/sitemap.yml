name: Générer le Sitemap Automatiquement

on:
  push:
    branches:
      - main  # Remplacez par 'master' si votre branche principale s'appelle master

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Générer le sitemap
        uses: cicirello/generate-sitemap@v1
        with:
          base-url-path: https://nexfixcontact-hub.github.io/NexFix/

      - name: Publier le sitemap sur le dépôt
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "Mise à jour automatique du sitemap" || exit 0
          git push
